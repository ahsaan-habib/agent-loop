[project]
name = "agent-loop"
version = "0.1.0"
description = "An agent is a loop. This one has guardrails on every side."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[project.optional-dependencies]
docs = ["rag-grounded @ git+https://github.com/ahsaan-habib/rag-grounded.git"]

[project.scripts]
agent = "agent.cli:main"
